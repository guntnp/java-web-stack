# Local development (http://localhost:8080). No proxy in front, so $remote_addr is the visitor.

# Request limits per client IP, used by /api/ in site.inc. "auth_write" only counts login and register POSTs.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
map "$request_method $uri" $auth_write_key {
    "~^POST /api/auth/(login|register)$"  $binary_remote_addr;
    default                                "";
}
limit_req_zone $auth_write_key zone=auth_write:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    set $proto $scheme;
    include /etc/nginx/snippets/site.inc;
}
