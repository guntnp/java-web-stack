# Production behind a Cloudflare Tunnel: every request arrives from the cloudflared container over plain http,
# and Cloudflare already terminated HTTPS. No port of this server is published (see docker/compose.prod.yml).

# Request limits per client IP, used by /api/ in site.inc. "auth_write" only counts login and register POSTs.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
map "$request_method $uri" $auth_write_key {
    "~^POST /api/auth/(login|register)$"  $binary_remote_addr;
    default                                "";
}
limit_req_zone $auth_write_key zone=auth_write:10m rate=10r/m;

server {
    listen 80;
    server_name _;

    # Take the visitor's IP from Cloudflare's header, but only when the request comes from a Docker network
    # (the cloudflared container). Without this every visitor is the tunnel's IP and shares one rate limit.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;

    # Visitors always reach Cloudflare over HTTPS, so tell the app so (cookies get Secure, redirects use https).
    set $proto https;
    add_header Strict-Transport-Security "max-age=31536000" always;

    include /etc/nginx/snippets/site.inc;
}
