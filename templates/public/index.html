<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My App</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <main>
    <h1>My App</h1>
    <p id="who"></p>

    <form id="login">
      <input id="email" type="email" placeholder="อีเมล" autocomplete="username" required>
      <input id="password" type="password" placeholder="รหัสผ่าน" autocomplete="current-password" required>
      <button type="submit">เข้าสู่ระบบ</button>
      <button type="button" id="logout">ออกจากระบบ</button>
      <p id="message"></p>
    </form>

    <h2>สินค้า</h2>
    <ul id="products"></ul>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
